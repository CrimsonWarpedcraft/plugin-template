name: Release

permissions:
  contents: read

on:
  push:
    tags:
      - 'v*' # For v1.0, v0.1.0, etc

concurrency:
  group: ${{ format('{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: true

jobs:
  candidate:
    name: Build and verify release candidate on Ubuntu
    runs-on: ubuntu-latest
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      jar-name: ${{ steps.jar.outputs.name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Common Setup
        uses: ./.github/actions/common-setup

      - name: Build, run integration tests and verify the shaded JAR
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: ./gradlew "-Pver=$RELEASE_TAG" release --stacktrace

      - name: Select the single release JAR
        id: jar
        run: |
          shopt -s nullglob
          jars=(build/libs/*.jar)
          if [[ ${#jars[@]} -ne 1 ]]; then
            echo "Expected one release JAR, found ${#jars[@]}" >&2
            exit 1
          fi
          echo "name=$(basename "${jars[0]}")" >> "$GITHUB_OUTPUT"

      - name: Upload verified candidate
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: Release Build
          path: build/libs/${{ steps.jar.outputs.name }}
          if-no-files-found: error
          retention-days: 14

  verify-windows:
    name: Verify the Ubuntu release JAR on Windows
    needs: candidate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/common-setup

      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.candidate.outputs.artifact-id }}
          merge-multiple: true
          digest-mismatch: error
          path: candidate

      - name: Test the downloaded JAR
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          CANDIDATE: candidate/${{ needs.candidate.outputs.jar-name }}
        run: ./gradlew "-Pver=$env:RELEASE_TAG" "-PartifactUnderTest=$env:CANDIDATE" artifactTest --stacktrace

  release:
    needs: [candidate, verify-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.candidate.outputs.artifact-id }}
          merge-multiple: true
          digest-mismatch: error
          path: candidate

      - name: Create Release
        uses: softprops/action-gh-release@v3
        id: release
        with:
          files: candidate/${{ needs.candidate.outputs.jar-name }}
          generate_release_notes: true
          name: ${{ format('Release {0}', github.ref_name) }}
          prerelease: ${{ contains(github.ref_name, '-RC-') }}
          fail_on_unmatched_files: true
          draft: true
    outputs:
      url: ${{ steps.release.outputs.url }}

  notify:
    name: Send job complete notification
    runs-on: ubuntu-latest
    needs:
      - release
    if: always() && vars.DISCORD_WEBHOOK_ID
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Common Setup
        uses: ./.github/actions/common-setup
        with:
          java-version: 25

      - name: Retrieve Project Name
        run: echo "PROJECT_NAME=$(${{github.workspace}}/gradlew -q printProjectName)" >> $GITHUB_ENV

      - name: Notify on success
        if: success() && needs.release.result == 'success'
        uses: appleboy/discord-action@v1.2.0
        with:
          webhook_id: ${{ vars.DISCORD_WEBHOOK_ID }}
          webhook_token: ${{ secrets.DISCORD_WEBHOOK_TOKEN }}
          color: "#00FF00"
          username: "${{ env.PROJECT_NAME }} Release Bot"
          message: >
            An ${{ env.PROJECT_NAME }} release draft was deployed by ${{ github.actor }}:
            ${{ needs.release.outputs.url }}

      - name: Notify on failure
        if: ${{ !cancelled() && needs.release.result != 'success' }}
        uses: appleboy/discord-action@v1.2.0
        with:
          webhook_id: ${{ vars.DISCORD_WEBHOOK_ID }}
          webhook_token: ${{ secrets.DISCORD_WEBHOOK_TOKEN }}
          color: "#FF0000"
          username: "${{ env.PROJECT_NAME }} Release Bot"
          message: >
            An ${{ env.PROJECT_NAME }} release draft ran by ${{ github.actor }} failed:
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
